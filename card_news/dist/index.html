<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>오늘의 관심종목</title>
<meta name="description" content="오늘 유동성 높은 대형주 중 변동이 컸던 10종목을 실제 뉴스와 함께 정리한 카드뉴스">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --paper: #F6F6F3;
    --surface: #FFFFFF;
    --surface-2: #EEEEEA;
    --ink: #15171D;
    --ink-2: #5C5F68;
    --ink-3: #8C8F98;
    --line: #E3E3DE;
    --accent: #2C3A73;
    --accent-soft: #E8EAF3;
    --up: #1D7A57;
    --up-soft: #E2F2EA;
    --down: #B03F27;
    --down-soft: #FBE8E2;
    --gold: #A9791F;
    --gold-soft: #F5EBD6;
    --shadow: 0 1px 2px rgba(20,20,15,.04), 0 10px 24px -12px rgba(20,20,15,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F1013; --surface: #191B20; --surface-2: #212329;
      --ink: #EEEEF0; --ink-2: #A4A7B0; --ink-3: #74777F; --line: #2B2D34;
      --accent: #8B9BE8; --accent-soft: #232842;
      --up: #55C495; --up-soft: #172C24;
      --down: #E2836A; --down-soft: #35211B;
      --gold: #D9AE64; --gold-soft: #33291A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F1013; --surface: #191B20; --surface-2: #212329;
    --ink: #EEEEF0; --ink-2: #A4A7B0; --ink-3: #74777F; --line: #2B2D34;
    --accent: #8B9BE8; --accent-soft: #232842;
    --up: #55C495; --up-soft: #172C24;
    --down: #E2836A; --down-soft: #35211B;
    --gold: #D9AE64; --gold-soft: #33291A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 0;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    margin-inline: -16px;
    padding: 14px 16px 12px;
  }
  .topbar .row { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: 'Newsreader', serif; font-weight: 600; font-size: 19px; letter-spacing: .2px; }
  .brand span { color: var(--gold); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .updated { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: 0 0 auto; }
  .live-dot.on { background: var(--up); animation: livepulse 1.6s infinite; }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 rgba(29,122,87,.45); }
    70% { box-shadow: 0 0 0 6px rgba(29,122,87,0); }
    100% { box-shadow: 0 0 0 0 rgba(29,122,87,0); }
  }
  @media (prefers-reduced-motion: reduce) { .live-dot.on { animation: none; } }

  .menu-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); cursor: pointer; padding: 0;
  }
  .menu-btn span { display: block; width: 16px; height: 2px; background: var(--ink); border-radius: 1px; }
  .menu-btn:hover { background: var(--surface-2); }
  .menu-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (min-width: 900px) { .menu-btn { display: none; } }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(10, 10, 10, .42);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 84vw);
    background: var(--surface); z-index: 41; overflow-y: auto;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-104%); transition: transform .22s ease;
    box-shadow: 10px 0 30px rgba(0, 0, 0, .18);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .drawer-head span { font-family: 'Newsreader', serif; font-size: 17px; font-weight: 600; }
  .drawer-close {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); cursor: pointer; font-size: 14px;
  }
  .drawer-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drawer-list { display: flex; flex-direction: column; gap: 8px; }
  .drawer-list .nav-item { width: 100%; }
  .drawer-list .nav-name { display: block; }
  @media (min-width: 900px) { .drawer, .drawer-backdrop { display: none; } }

  .overview { padding: 20px 2px 18px; max-width: 760px; }
  .overview .date { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .overview p { font-family: 'Newsreader', serif; font-size: 18px; line-height: 1.5; margin: 8px 0 0; text-wrap: balance; }

  /* ---- 3열 뉴스 포털 레이아웃 (좌: 종목목록 / 중앙: 상세 / 우: 관련뉴스) ---- */
  .layout { display: grid; grid-template-columns: 1fr; gap: 16px; padding-bottom: 88px; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 216px minmax(0, 1fr) 300px; align-items: start; gap: 20px; }
  }

  /* 좌측: 종목 목록 — 모바일에서는 숨기고 상단 메뉴 버튼→드로어로, 데스크톱은 세로 고정 사이드바 */
  .ticker-nav { display: none; }
  @media (min-width: 900px) {
    .ticker-nav {
      display: flex; flex-direction: column; gap: 8px;
      position: sticky; top: calc(64px + env(safe-area-inset-top, 0px));
      max-height: calc(100vh - 96px); overflow-y: auto;
    }
  }
  .nav-item {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 9px 12px; cursor: pointer;
    font-family: inherit; color: var(--ink); text-align: left;
  }
  @media (min-width: 900px) { .nav-item { width: 100%; } }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .nav-sym { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13.5px; }
  .nav-name { display: none; font-size: 12.5px; color: var(--ink-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (min-width: 900px) { .nav-name { display: block; } }
  .nav-chg { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nav-chg.up { color: var(--up); }
  .nav-chg.down { color: var(--down); }

  /* 중앙: 상세 */
  .detail {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); padding: 24px 24px 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .idx { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .arrows { display: flex; gap: 6px; }
  .arrow-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
  }
  .arrow-btn:hover { background: var(--surface-2); }
  .arrow-btn:disabled { opacity: .35; cursor: default; }
  .arrow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ticker-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ticker { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 28px; }
  .cname { font-family: 'Newsreader', serif; font-size: 18px; color: var(--ink-2); }
  .sector { font-size: 12px; color: var(--ink-3); margin-top: -8px; }

  .price-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .price { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chg { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; padding: 3px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); background: var(--up-soft); }
  .chg.down { color: var(--down); background: var(--down-soft); }
  .substats { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .chart-row { display: flex; align-items: center; gap: 14px; padding: 4px 0 2px; }
  .spark-svg { flex: 0 0 auto; display: block; }
  .rel-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .rel-badge.up { color: var(--up); background: var(--up-soft); }
  .rel-badge.down { color: var(--down); background: var(--down-soft); }
  .rel-badge .label { font-family: 'Archivo', sans-serif; font-weight: 500; color: var(--ink-3); margin-right: 3px; }

  .hook { font-family: 'Newsreader', serif; font-style: italic; font-size: 17px; line-height: 1.45; border-left: 2px solid var(--accent); padding-left: 12px; }
  .body-text { font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }

  /* 모바일에서만 상세 안에도 뉴스 요약을 살짝 보여줌 (우측 패널이 아래로 밀리므로) */
  .inline-news { display: block; border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 2px; }
  @media (min-width: 900px) { .inline-news { display: none; } }
  .inline-news .news-label { margin-bottom: 8px; }

  /* 우측: 관련 뉴스 */
  .related {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); padding: 20px 18px;
  }
  @media (min-width: 900px) {
    .related { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 96px); overflow-y: auto; }
  }
  .related-head { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 12px; }
  .related-head b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0; }
  .news-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
  .news-list { display: flex; flex-direction: column; gap: 9px; }
  .news-item { display: block; text-decoration: none; color: inherit; border-radius: 10px; padding: 10px 11px; background: var(--surface-2); }
  button.news-item { border: none; width: 100%; text-align: left; font: inherit; cursor: pointer; }
  a.news-item:hover, button.news-item:hover { background: var(--accent-soft); }
  button.news-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .news-text { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .news-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .news-meta .ext { margin-left: auto; }
  .news-empty { font-size: 13px; color: var(--ink-3); padding: 6px 2px; }

  /* ---- 뉴스 상세 모달 (한국어 요약 + 이미지 + 원문 링크) ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 10, 10, .5);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.98);
    width: min(520px, 92vw); max-height: 86vh; overflow-y: auto;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    z-index: 61; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .modal-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: rgba(20, 20, 20, .55); color: #fff; cursor: pointer; font-size: 14px; z-index: 2;
  }
  .modal-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .modal-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--surface-2); }
  .modal-body { padding: 18px 20px 22px; }
  .modal-meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; }
  .modal-headline { font-family: 'Newsreader', serif; font-size: 19px; line-height: 1.4; margin: 0 0 12px; }
  .modal-summary { font-size: 14.5px; line-height: 1.75; color: var(--ink-2); margin: 0 0 18px; white-space: pre-line; }
  .modal-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    text-decoration: none;
  }
  .modal-link:hover { filter: brightness(0.97); }
  .modal-note { font-size: 11px; color: var(--ink-3); margin-top: 10px; }

  footer.disclaimer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    font-size: 11.5px; line-height: 1.4; color: var(--ink-3);
    text-align: center;
  }
  footer.disclaimer strong { color: var(--ink-2); }

  @media (max-width: 460px) {
    .detail { padding: 18px 16px 16px; }
    .ticker { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="row">
    <div class="brand">오늘의 관심종목<span>.</span></div>
    <div class="topbar-right">
      <span class="live-badge"><span class="live-dot" id="liveDot"></span><span id="liveStatus">연결 중…</span></span>
      <button class="menu-btn" id="menuBtn" aria-label="종목 목록 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="updated" id="updated">불러오는 중…</div>
    </div>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-label="종목 목록" aria-hidden="true">
  <div class="drawer-head">
    <span>종목 목록</span>
    <button class="drawer-close" id="drawerClose" aria-label="닫기">✕</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</aside>

<div class="wrap">
  <div class="overview">
    <div class="date" id="marketDate">—</div>
    <p id="overviewText">데이터를 불러오는 중입니다…</p>
  </div>

  <div class="layout">
    <nav class="ticker-nav" id="tickerNav" aria-label="종목 목록"></nav>
    <main class="detail" id="detail"></main>
    <aside class="related" id="related"></aside>
  </div>
</div>

<footer class="disclaimer">
  <strong>정보 제공 목적</strong> · 실제 뉴스를 요약한 페이지이며 특정 종목의 매수·매도를 권유하지 않습니다. 투자 판단과 책임은 본인에게 있습니다.
</footer>

<div class="modal-backdrop" id="newsBackdrop"></div>
<div class="modal" id="newsModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalHeadline">
  <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
  <div id="modalImgWrap"></div>
  <div class="modal-body">
    <div class="modal-meta" id="modalMeta"></div>
    <h3 class="modal-headline" id="modalHeadline"></h3>
    <p class="modal-summary" id="modalSummary"></p>
    <a class="modal-link" id="modalLink" target="_blank" rel="noopener noreferrer">원문 보기 (영어) ↗</a>
    <div class="modal-note">AI가 원문을 바탕으로 요약한 내용입니다. 정확한 내용은 원문에서 확인하세요.</div>
  </div>
</div>

<script>
(function () {
  const navEl = document.getElementById('tickerNav');
  const drawerListEl = document.getElementById('drawerList');
  const drawerEl = document.getElementById('drawer');
  const backdropEl = document.getElementById('drawerBackdrop');
  const menuBtn = document.getElementById('menuBtn');
  const drawerCloseBtn = document.getElementById('drawerClose');
  const detailEl = document.getElementById('detail');
  const relatedEl = document.getElementById('related');
  let data = null;
  let active = 0;

  function openDrawer() {
    drawerEl.classList.add('open');
    backdropEl.classList.add('open');
    drawerEl.setAttribute('aria-hidden', 'false');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    drawerEl.classList.remove('open');
    backdropEl.classList.remove('open');
    drawerEl.setAttribute('aria-hidden', 'true');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openDrawer);
  drawerCloseBtn.addEventListener('click', closeDrawer);
  backdropEl.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  function pct(x) { return (x >= 0 ? '+' : '') + (x * 100).toFixed(2) + '%'; }

  function fmtUpdated(iso) {
    try {
      const d = new Date(iso);
      return '해설 ' + new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(d) + ' 작성';
    } catch (e) { return ''; }
  }

  function fmtClock(iso) {
    try {
      return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(iso));
    } catch (e) { return ''; }
  }

  function fmtShortDate(iso) {
    try {
      const d = new Date(iso);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    } catch (e) { return ''; }
  }

  function sparklineSvg(prices) {
    if (!Array.isArray(prices) || prices.length < 2) return '';
    const w = 112, h = 32, pad = 3;
    const min = Math.min(...prices), max = Math.max(...prices);
    const span = (max - min) || 1;
    const stepX = (w - pad * 2) / (prices.length - 1);
    const pts = prices.map((p, i) => [
      pad + i * stepX,
      pad + (1 - (p - min) / span) * (h - pad * 2),
    ]);
    const dirUp = prices[prices.length - 1] >= prices[0];
    const color = dirUp ? 'var(--up)' : 'var(--down)';
    const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const [lx, ly] = pts[pts.length - 1];
    return `
      <svg class="spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="최근 ${prices.length}거래일 가격 추이">
        <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
        <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${color}" />
      </svg>
    `;
  }

  function relBadgeHtml(c) {
    if (c.rel_strength == null) return '';
    const dir = c.rel_strength >= 0 ? 'up' : 'down';
    const arrow = c.rel_strength >= 0 ? '▲' : '▼';
    return `<span class="rel-badge ${dir}"><span class="label">SPY 대비</span>${arrow} ${pct(c.rel_strength)}</span>`;
  }

  // 뉴스 항목 클릭 시 열 모달 내용을 key로 찾기 위한 조회 테이블
  const newsLookup = {};

  function newsItemHtml(n, keyPrefix) {
    const metaBits = [];
    if (n.source) metaBits.push(n.source);
    if (n.date) metaBits.push(n.date);
    const meta = metaBits.join(' · ');
    const hasSummary = !!n.korean_summary;
    const inner = `
      <div class="news-text">${n.text}</div>
      <div class="news-meta">${meta ? `<span>${meta}</span>` : ''}${hasSummary ? '<span class="ext">자세히 보기 ↗</span>' : (n.url ? '<span class="ext">열기 ↗</span>' : '')}</div>
    `;
    if (hasSummary) {
      // 한국어 요약이 있으면 페이지 이동 대신 모달을 연다
      const key = keyPrefix + '|' + (n.url || n.text);
      newsLookup[key] = n;
      return `<button type="button" class="news-item" data-key="${encodeURIComponent(key)}">${inner}</button>`;
    }
    return n.url
      ? `<a class="news-item" href="${n.url}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<div class="news-item">${inner}</div>`;
  }

  function wireNewsItems(container) {
    container.querySelectorAll('.news-item[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        const n = newsLookup[decodeURIComponent(btn.dataset.key)];
        if (n) openNewsModal(n);
      });
    });
  }

  const modalEl = document.getElementById('newsModal');
  const modalBackdropEl = document.getElementById('newsBackdrop');
  const modalImgWrap = document.getElementById('modalImgWrap');
  const modalMeta = document.getElementById('modalMeta');
  const modalHeadlineEl = document.getElementById('modalHeadline');
  const modalSummaryEl = document.getElementById('modalSummary');
  const modalLinkEl = document.getElementById('modalLink');
  const modalCloseBtn = document.getElementById('modalClose');

  function openNewsModal(n) {
    modalImgWrap.innerHTML = n.image ? `<img class="modal-img" src="${n.image}" alt="" loading="lazy">` : '';
    const metaBits = [];
    if (n.source) metaBits.push(n.source);
    if (n.date) metaBits.push(n.date);
    modalMeta.textContent = metaBits.join(' · ');
    modalHeadlineEl.textContent = n.text;
    modalSummaryEl.textContent = n.korean_summary || '';
    modalLinkEl.href = n.url || '#';
    modalEl.classList.add('open');
    modalBackdropEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
  }
  function closeNewsModal() {
    modalEl.classList.remove('open');
    modalBackdropEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
  }
  modalCloseBtn.addEventListener('click', closeNewsModal);
  modalBackdropEl.addEventListener('click', closeNewsModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNewsModal(); });

  function renderNav() {
    const itemsHtml = data.cards.map((c, i) => `
      <button class="nav-item${i === active ? ' active' : ''}" data-i="${i}" aria-pressed="${i === active}">
        <span class="nav-sym">${c.symbol}</span>
        <span class="nav-name">${c.name}</span>
        <span class="nav-chg ${c.day_return >= 0 ? 'up' : 'down'}">${pct(c.day_return)}</span>
      </button>
    `).join('');
    navEl.innerHTML = itemsHtml;
    drawerListEl.innerHTML = itemsHtml;
    [navEl, drawerListEl].forEach(container => {
      container.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          select(Number(btn.dataset.i));
          closeDrawer();
        });
      });
    });
  }

  function renderDetail() {
    const c = data.cards[active];
    const dirClass = c.day_return >= 0 ? 'up' : 'down';
    const arrow = c.day_return >= 0 ? '▲' : '▼';
    const newsHtml = c.bullets.length
      ? c.bullets.map(b => newsItemHtml(b, 'detail-' + active)).join('')
      : '<div class="news-empty">관련 뉴스가 확인되지 않았습니다.</div>';
    detailEl.innerHTML = `
      <div class="detail-head">
        <span class="tag">${c.tag}</span>
        <div class="head-right">
          <span class="idx">${String(active + 1).padStart(2, '0')} / ${String(data.cards.length).padStart(2, '0')}</span>
          <div class="arrows">
            <button class="arrow-btn" id="prevBtn" aria-label="이전 종목" ${active === 0 ? 'disabled' : ''}>‹</button>
            <button class="arrow-btn" id="nextBtn" aria-label="다음 종목" ${active === data.cards.length - 1 ? 'disabled' : ''}>›</button>
          </div>
        </div>
      </div>
      <div>
        <div class="ticker-row"><span class="ticker">${c.symbol}</span><span class="cname">${c.name}</span></div>
        <div class="sector">${c.sector}</div>
      </div>
      <div class="price-row">
        <span class="price">$${c.price.toFixed(2)}</span>
        <span class="chg ${dirClass}">${arrow} ${pct(c.day_return)}</span>
      </div>
      <div class="substats">5일 ${pct(c.return_5d)} · 거래량 평소 대비 ${c.volume_ratio.toFixed(2)}배</div>
      <div class="chart-row">${sparklineSvg(c.spark)}${relBadgeHtml(c)}</div>
      <div class="hook">${c.hook}</div>
      <div class="body-text">${c.body}</div>
      <div class="inline-news">
        <div class="news-label" style="margin-bottom:8px">관련 뉴스</div>
        <div class="news-list">${newsHtml}</div>
      </div>
    `;
    detailEl.querySelector('#prevBtn').addEventListener('click', () => select(active - 1));
    detailEl.querySelector('#nextBtn').addEventListener('click', () => select(active + 1));
    wireNewsItems(detailEl);
  }

  function renderRelated() {
    const c = data.cards[active];
    const newsHtml = c.bullets.length
      ? c.bullets.map(b => newsItemHtml(b, 'related-' + active)).join('')
      : '<div class="news-empty">관련 뉴스가 확인되지 않았습니다.</div>';
    relatedEl.innerHTML = `
      <div class="related-head">관련 뉴스 · <b>${c.symbol}</b></div>
      <div class="news-list">${newsHtml}</div>
    `;
    wireNewsItems(relatedEl);
  }

  function select(i) {
    i = Math.max(0, Math.min(data.cards.length - 1, i));
    if (i === active) return;
    active = i;
    renderNav();
    renderDetail();
    renderRelated();
  }

  function render(d) {
    data = d;
    document.getElementById('marketDate').textContent = d.market_date;
    document.getElementById('overviewText').textContent = d.overview;
    document.getElementById('updated').textContent = fmtUpdated(d.generated_at);
    renderNav();
    renderDetail();
    renderRelated();
  }

  document.addEventListener('keydown', (e) => {
    if (!data) return;
    if (e.key === 'ArrowRight') select(active + 1);
    if (e.key === 'ArrowLeft') select(active - 1);
  });

  // ---- 실시간 시세·뉴스 (서버리스 함수 폴링) ----
  // hook/body 해설은 data.json(주기적으로 다시 씀)에서 그대로 두고,
  // price/day_return/뉴스만 매 주기마다 최신값으로 덮어써서 다시 그린다.
  const liveStatusEl = document.getElementById('liveStatus');
  const liveDotEl = document.getElementById('liveDot');
  const LIVE_ENDPOINT = '/.netlify/functions/live';
  const LIVE_INTERVAL_MS = 45000;

  function mergeLive(live) {
    if (!data) return;
    const quoteMap = {};
    (live.quotes || []).forEach(q => { if (q.ok) quoteMap[q.symbol] = q; });
    data.cards.forEach(c => {
      const q = quoteMap[c.symbol];
      if (q && q.price != null && q.day_return != null) {
        c.price = q.price;
        c.day_return = q.day_return;
        if (live.spy_day_return != null) {
          c.rel_strength = c.day_return - live.spy_day_return;
        }
      }
      const liveNews = (live.news || {})[c.symbol];
      if (liveNews && liveNews.length) {
        c.bullets = liveNews.map(n => ({ text: n.text, source: n.source, date: fmtShortDate(n.published_at), url: n.url }));
      }
    });
  }

  function pollLive() {
    fetch(LIVE_ENDPOINT, { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : Promise.reject(new Error('bad status'))))
      .then(live => {
        if (live.error) return Promise.reject(new Error(live.error));
        mergeLive(live);
        renderNav(); renderDetail(); renderRelated();
        liveStatusEl.textContent = '실시간 · ' + fmtClock(live.fetched_at);
        liveDotEl.classList.add('on');
      })
      .catch(() => {
        liveStatusEl.textContent = '실시간 연결 안 됨';
        liveDotEl.classList.remove('on');
      });
  }

  fetch('data.json')
    .then(r => r.json())
    .then(d => {
      render(d);
      pollLive();
      setInterval(pollLive, LIVE_INTERVAL_MS);
    })
    .catch(() => {
      document.getElementById('overviewText').textContent = '데이터를 불러오지 못했습니다. data.json 파일을 확인해주세요.';
    });
})();
</script>
</body>
</html>
